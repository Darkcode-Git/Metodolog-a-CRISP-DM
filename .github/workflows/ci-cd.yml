name: CI/CD - Stock Analysis & Machine Learning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar calidad del código
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics
      - name: Ejecutar pruebas
        run: |
          python -m pytest -q --cov=analisis_acciones \
            --cov-report=term-missing --cov-report=xml

  despliegue:
    name: Despliegue continuo
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Notificar al proveedor de nube
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST "$DEPLOY_WEBHOOK_URL"
      - name: Informar despliegue GitOps
        if: env.DEPLOY_WEBHOOK_URL == ''
        run: |
          echo "CI aprobado en main. El proveedor GitOps desplegará la revisión."
          echo "Configure DEPLOY_WEBHOOK_URL para notificar un PaaS por webhook."
